$kind: http-request
name: Lấy CSRF mới sau đăng nhập (GET /songs)
description: Spring Security đổi CSRF token sau khi đăng nhập, nên phải lấy lại token từ một trang có form.
url: "{{baseUrl}}/songs"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // Lấy _csrf token (Spring Security) từ HTML để dùng cho các request POST
      const m = pm.response.text().match(/name="_csrf"[^>]*value="([^"]+)"/) || pm.response.text().match(/value="([^"]+)"[^>]*name="_csrf"/);
      if (m) { pm.collectionVariables.set('csrf', m[1]); }
      pm.test('Trang trả về 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
settings:
  followRedirects: false
order: 9000
