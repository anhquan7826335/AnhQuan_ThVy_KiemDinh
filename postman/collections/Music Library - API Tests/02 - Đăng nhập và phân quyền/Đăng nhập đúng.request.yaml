$kind: http-request
url: "{{baseUrl}}/login"
method: POST
body:
  type: urlencoded
  content:
    username: "{{newUser}}"
    password: Passw0rd123
    _csrf: "{{csrf}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Đăng nhập thành công (không về /login?error)', function () {
        pm.expect(pm.response.code).to.be.oneOf([301,302,303]);
        pm.expect(pm.response.headers.get('Location') || '').to.not.include('error');
      });
    language: text/javascript
settings:
  followRedirects: false
order: 8000
