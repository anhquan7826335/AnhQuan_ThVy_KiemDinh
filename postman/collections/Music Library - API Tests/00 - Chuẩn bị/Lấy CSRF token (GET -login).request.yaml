$kind: http-request
name: Lấy CSRF token (GET /login)
description: Chạy đầu tiên. Spring Security bật CSRF mặc định nên mọi POST cần _csrf.
url: "{{baseUrl}}/login"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // Lấy _csrf token (Spring Security) từ HTML để dùng cho các request POST
      const m = pm.response.text().match(/name="_csrf"[^>]*value="([^"]+)"/) || pm.response.text().match(/value="([^"]+)"[^>]*name="_csrf"/);
      if (m) { pm.collectionVariables.set('csrf', m[1]); }
      pm.test('Trang trả về 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
settings:
  followRedirects: false
order: 1000
