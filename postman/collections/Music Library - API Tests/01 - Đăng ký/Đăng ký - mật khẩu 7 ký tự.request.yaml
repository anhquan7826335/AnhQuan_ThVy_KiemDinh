$kind: http-request
url: "{{baseUrl}}/register"
method: POST
body:
  type: urlencoded
  content:
    username: short_{{$timestamp}}
    email: s{{$timestamp}}@test.com
    password: "1234567"
    _csrf: "{{csrf}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Redirect /register?error', function () {
        pm.expect(pm.response.code).to.be.oneOf([301,302,303]);
        pm.expect(pm.response.headers.get('Location') || '').to.include('/register?error');
      });
    language: text/javascript
settings:
  followRedirects: false
order: 3000
