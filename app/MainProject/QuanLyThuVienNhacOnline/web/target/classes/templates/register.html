<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <main class="container py-5" style="max-width: 480px;">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-4">Create account</h1>
                <div th:if="${param.error}" class="alert alert-danger" role="alert">
                    Invalid details, or that username/email is already registered. Passwords must be at least 8
                    characters.
                </div>
                <form th:action="@{/register}" th:object="${userRequest}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input id="username" th:field="*{username}" type="text" class="form-control"
                            autocomplete="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input id="email" th:field="*{email}" type="email" class="form-control" autocomplete="email"
                            required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input id="password" th:field="*{password}" type="password" class="form-control"
                            autocomplete="new-password" minlength="8" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Register</button>
                </form>
                <p class="mt-3 mb-0 text-center">
                    Already have an account? <a th:href="@{/login}">Login</a>
                </p>
            </div>
        </div>
    </main>
</body>

</html>
